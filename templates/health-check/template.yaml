title: Health check
description: Checks this host's health every day with the diagnostic playbooks (failed units, disk, errors, updates) and on request with any of them, and reports what it finds, the likely causes and a plan for you to carry out. Read-only; the bundled diagnostics agent.
system: any
mode: supervised
needs:
  - systemd-mcp
  - mcp-gateway-exec-server with exec.d-diagnostics.yaml and exec.d-disk-usage.yaml in /etc/mcp-gateway/exec.d/
  - Custos's server custos-net (mcp-gateway 1.15) with /usr/share/custos/gateway/servers.d/custos-net.yaml in /etc/mcp-gateway/servers.d/
  - mcp-server-zypp and mcp-server-snapper, or on a transactional system mcp-server-tukit, as far as they are installed
  - for checking against the product documentation (optional), mcp-docs at the gateway as the server suse-docs, with documentation such as suse-docs-mcp-sles-16.0 and custos-docs
