# What patch-pilot-transactional may do at the gateway (CONTRACT.md §6,
# §6a), with mcp-server-tukit. Refreshing the repositories only fetches
# their metadata, so it is read-only like listing the updates: looking
# for updates needs no approval. An update goes into a new snapshot and
# changes nothing running, so it is patch-errata and can be promoted for
# a window (envelopes/patch-errata.yaml). Reboot, apply and rollback
# change what runs: they have no category, so they need an approval
# every time, whatever is promoted. run_in_snapshot and the single
# deletions are not listed: denied.
- {server: tukit, tool: get_status, read_only: true}
- {server: tukit, tool: list_snapshots, read_only: true}
- {server: tukit, tool: list_updates, read_only: true}
- {server: tukit, tool: refresh_repositories, read_only: true}
- {server: tukit, tool: update_system, category: patch-errata}
- {server: tukit, tool: cleanup_snapshots, category: patch-errata}
- {server: tukit, tool: reboot}
- {server: tukit, tool: apply}
- {server: tukit, tool: rollback}
# The product documentation through the gateway (mcp-docs as the server
# suse-docs): reading only. Without it, these are never asked.
- {server: suse-docs, tool: find_sections, read_only: true}
- {server: suse-docs, tool: search, read_only: true}
- {server: suse-docs, tool: outline, read_only: true}
- {server: suse-docs, tool: read_section, read_only: true}
