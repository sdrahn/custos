title: Exposure watch
description: Reports the firewall's zones, the services they allow and the running services, and what to change. Read-only.
system: any
mode: advisory
needs:
  - firewalld-mcp
  - systemd-mcp
  - for checking against the product documentation (optional), mcp-docs at the gateway as the server suse-docs, with documentation such as suse-docs-mcp-sles-16.0 and custos-docs
