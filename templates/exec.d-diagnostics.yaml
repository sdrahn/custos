# Read-only diagnostic commands for mcp-gateway's exec server
# (mcp-gateway-exec-server), which the diagnostic playbooks
# (/usr/share/custos/playbooks, CONTRACT.md §14c) call. Copy to
# /etc/mcp-gateway/exec.d/ and check with
# /usr/libexec/mcp-servers/mcp-server-exec --check. They run as the calling
# agent's user, without network, and take no arguments. Each is a tool
# exec__<name>; give an agent read_only permissions with category
# diagnostics for the ones it uses. sestatus is found on the server's
# PATH (/usr/sbin:/usr/bin), wherever the distribution puts it. The
# network commands are not here: the exec server sees none of the host's
# network; Custos's server custos-net has them (/usr/share/custos/gateway).
version: 1
commands:
  memory_usage:
    description: Memory and swap in use, in MiB (free -m -w)
    argv: [/usr/bin/free, -m, -w]
    read_only: true
  pressure_stall:
    description: Pressure stall information for CPU, memory and I/O (/proc/pressure)
    # SUSE kernels have it off unless booted with psi=1: say so, not fail.
    argv: [/usr/bin/sh, -c, "if [ -d /proc/pressure ]; then cd /proc/pressure && grep -H . cpu memory io; else echo 'Pressure stall information is off in this kernel (boot with psi=1 to turn it on).'; fi"]
    read_only: true
  load_average:
    description: Uptime and load averages (uptime)
    argv: [/usr/bin/uptime]
    read_only: true
  time_status:
    description: The clock, time zone and whether NTP has synchronized it (timedatectl show)
    argv: [/usr/bin/timedatectl, show]
    read_only: true
  boot_time:
    description: How long the last boot took, by phase (systemd-analyze time)
    argv: [/usr/bin/systemd-analyze, time]
    read_only: true
  boot_blame:
    description: The units that took longest to start at the last boot (systemd-analyze blame)
    argv: [/usr/bin/systemd-analyze, blame, --no-pager]
    read_only: true
  selinux_status:
    description: SELinux mode, policy and its state (sestatus)
    argv: [/usr/bin/env, sestatus]
    read_only: true
  reboot_status:
    description: Whether an update waits for a reboot (a newer kernel installed than running, /run/reboot-needed), and the kernels (rpm)
    # The installed kernels come from rpm (a SUSE kernel package provides
    # kernel-uname-r = its uname -r): the server's sandbox hides
    # /usr/lib/modules. zypper and transactional-update write
    # /run/reboot-needed after an update that needs a reboot; the
    # sandbox's /run is not the host's (it does not show that file), so
    # the answer counts it when it sees it and otherwise says it may not
    # see it, never that nothing waits.
    # Which services wait for a restart (zypper ps) is not here: it reads
    # other users' processes, and the command runs as the agent's user.
    argv:
      - /usr/bin/sh
      - -c
      - |
        running=$(uname -r)
        kernels=$(rpm -q --whatprovides kernel-uname-r --qf '[%{PROVIDENAME}=%{PROVIDEVERSION}\n]' 2>/dev/null | sed -n 's/^kernel-uname-r=//p' | sort -uV)
        newest=$(printf '%s\n' "$kernels" | tail -n 1)
        if [ -e /run/reboot-needed ]; then
          echo 'A reboot is pending: /run/reboot-needed exists (an update needs one).'
        elif [ -n "$newest" ] && [ "$newest" != "$running" ]; then
          echo "A reboot is pending: kernel $newest is installed, $running is running."
        else
          echo 'No reboot is pending for a kernel: the newest installed kernel is running. Whether another update needs one (/run/reboot-needed, which zypper writes) may not be visible to this command.'
        fi
        echo "Running kernel: $running"
        echo "Installed kernels: $(printf '%s\n' "$kernels" | tr '\n' ' ')"
    # rpm opens its working directory; the server's sandbox does not let
    # it read /, the default.
    dir: /usr
    read_only: true
  package_dependencies:
    description: Unsatisfied dependencies of the installed packages; no file checks (rpm -Va --nofiles)
    # --noscripts: no package's %verify script runs; this only reads.
    argv: [/usr/bin/rpm, -Va, --nofiles, --nodigest, --nosignature, --noscripts]
    # rpm opens its working directory; the server's sandbox does not let
    # it read /, the default.
    dir: /usr
    read_only: true
    timeout: 300s
