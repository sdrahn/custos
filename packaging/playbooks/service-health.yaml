# A diagnostic playbook (CONTRACT.md §14c), installed in
# /usr/share/custos/playbooks/. A file of the same name in
# /etc/custos/playbooks/ replaces it; an empty one hides it.
service-health:
  title: Health of a service
  description: The state, recent log and configuration of one service, which the request names.
  needs:
    - "systemd-mcp"
  steps:
    - {tool: systemd__list_loaded_units, why: "The service's state, exit status, restart setting and unit file.", args: {patterns: ["{unit}"], state: all, properties: true}}
    - {tool: systemd__list_loaded_units, why: "The units that failed, among them those it depends on.", args: {state: failed}}
    - {tool: systemd__list_log, why: "The service's own recent journal.", args: {unit: ["{unit}"], exact_unit: true, count: 50}}
    - {tool: systemd__list_log, why: "systemd's account of it: starts, exits and restarts.", args: {pattern: "{unit_re}", count: 300}}
  look_for: >
    Restarts and failures (the restart counter, the exit status), the
    error the service itself logs before it exits, dependencies that are
    not active, and changes in its configuration. The unit file is at its
    FragmentPath (systemd__get_file reads it).
