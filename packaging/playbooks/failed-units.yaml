# A diagnostic playbook (CONTRACT.md §14c), installed in
# /usr/share/custos/playbooks/. A file of the same name in
# /etc/custos/playbooks/ replaces it; an empty one hides it.
failed-units:
  title: Failed units
  description: Which systemd units have failed, and why.
  needs:
    - "systemd-mcp"
  steps:
    - {tool: systemd__list_loaded_units, why: "The failed units, with their exit status and unit file.", args: {state: failed, properties: true}}
    - {tool: systemd__list_log, why: "The journal's lines about failures: systemd's account and the services' own errors.", args: {pattern: "Failed with result|Main process exited|Failed to start|Dependency failed|No such file|Permission denied|No space left|Address already in use", count: 300}}
    - {tool: systemd__list_log, why: "The unit's own journal.", args: {unit: ["{unit}"], exact_unit: true, count: 50}}
  look_for: >
    Units in state failed; the exit status or signal and the last error
    lines of each; a dependency that failed first; a missing file, a
    permission or SELinux denial, a port in use or a full disk as causes.
    The unit file is at its FragmentPath (systemd__get_file reads it).
    A unit named mcp-<server>-<hash>.service is one of mcp-gateway's
    server instances, started for one user or agent: it is transient
    (no unit file, it cannot be restarted), and its failure is the
    gateway server's, for example a server that user cannot use (no
    Podman socket of its own), not a fault of the host's services. Say
    so, name the server and the user, and propose no restart.
