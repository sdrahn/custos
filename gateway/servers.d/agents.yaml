# mcp-gateway server definition: delegation between agents
# (Custos CONTRACT.md §9). Installed as
# /usr/share/custos/gateway/servers.d/agents.yaml; link or copy it
# to /etc/mcp-gateway/servers.d/ to let agents delegate.
#
# Its one tool, agents__delegate, is governed like any other: an agent
# may delegate only where its permissions say so, e.g.
#   - {server: agents, tool: delegate, args: {agent: '^patch-pilot$'}}
# (agent-admin permissions NAME).
version: 1
name: agents
command: ["/usr/libexec/custos/agent-delegate"]
selinux_type: mcpsrv_agents_t
isolation: principal
network: false
# One account for every delegating agent, in agent-clients: an agent in
# OpenShell has no local user at the gateway (a token), and a throwaway
# one may not reach the sockets. The gateway tells the bridge whom it
# serves (MCP_GATEWAY_PRINCIPAL, mcp-gateway 1.17.1); the callee believes
# the agent it names from this account only (CONTRACT.md §9).
run_as: custos-delegate
discovery: shared
